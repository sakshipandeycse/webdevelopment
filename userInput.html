<html>
  <body>
    <script>
      function calculateSum(...numbers) {
        let total = 0;
        for (let i = 0; i < numbers.length; i++) {
          total += Number(numbers[i]);
        }
        console.log("Sum = " + total);
      }

      let a = prompt("Enter first number");
      let b = prompt("Enter second number");
      let c = prompt("Enter third number");

      calculateSum(a, b, c);
    </script>
  </body>
</html>
